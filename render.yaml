services:
  - type: web
    name: tradbot-crm
    runtime: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradbot-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
