services:
  - type: web
    name: tradbot-crm
    env: node
    region: oregon
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/auth/me
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tradbot-crm-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production

databases:
  - name: tradbot-crm-db
    plan: free
    region: oregon
